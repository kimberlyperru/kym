# render.yaml
# NOTE: Render free plan does NOT include MySQL.
# Use Railway for the free MySQL database (railway.app)
# See README for full setup steps.

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: kym-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      # All other vars set manually in Render dashboard — see README
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SUBSCRIPTION_PRICE_KSH
        value: "1"
      - key: MERCHANT_PHONE
        value: "+254725766883"
      - key: MERCHANT_NAME
        value: "Kym Trading Bot"
      - key: PAYMENT_TEST_MODE
        value: "true"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: MAX_LOGIN_ATTEMPTS
        value: "3"
      - key: LOCKOUT_DURATION
        value: "30"

  # ── Frontend ─────────────────────────────────────────────────────────────────
  - type: web
    name: kym-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_ADMIN_PATH
        value: id-1334
