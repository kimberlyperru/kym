# render.yaml — Render.com deployment
# Push this file to your GitHub repo root
# Then on Render: New → Blueprint → connect your repo

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: kym-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Database — Render auto-fills these from the database below
      - key: DB_HOST
        fromDatabase:
          name: kym-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: kym-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: kym-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kym-db
          property: password
      - key: DB_PORT
        fromDatabase:
          name: kym-db
          property: port

      # SSL needed for Render MySQL
      - key: DB_SSL
        value: true

      # Set these MANUALLY in Render dashboard → Environment tab:
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

      # IntaSend
      - key: INTASEND_PUBLISHABLE_KEY
        sync: false
      - key: INTASEND_SECRET_KEY
        sync: false
      - key: INTASEND_WEBHOOK_SECRET
        sync: false
      - key: SUBSCRIPTION_PRICE_KSH
        value: "1"
      - key: MERCHANT_PHONE
        value: "+254725766883"
      - key: MERCHANT_NAME
        value: "Kym Trading Bot"
      - key: PAYMENT_TEST_MODE
        value: "true"

      # Email
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

      # MT5 Bridge — your local PC IP (or ngrok URL — see note below)
      - key: MT5_BRIDGE_URL
        sync: false
      - key: MT5_BRIDGE_SECRET
        sync: false

      # News API
      - key: NEWS_API_KEY
        sync: false

      # Admin — keep these secret
      - key: ADMIN_SECRET_PATH
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Rate limiting
      - key: MAX_LOGIN_ATTEMPTS
        value: "3"
      - key: LOCKOUT_DURATION
        value: "30"

  # ── Frontend ─────────────────────────────────────────────────────────────────
  - type: web
    name: kym-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: REACT_APP_WS_URL
        sync: false
      - key: REACT_APP_ADMIN_PATH
        value: id-1334

# ── MySQL Database ────────────────────────────────────────────────────────────
databases:
  - name: kym-db
    plan: free
    databaseName: kym_trading
